<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nasir Bhaiya</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars"></div>

<div class="container">

    <div class="intro" id="intro">
        <h2>🎉 A Special Surprise 🎉</h2>
        <p>For Someone Special ❤️</p>
        <button id="startBtn">Open Surprise 🎁</button>
    </div>

    <div class="birthday" id="birthday">

        <h1>HAPPY BIRTHDAY</h1>
        <h2>NASIR BHAIYA ❤️</h2>

        <p class="wish">
            May your life be filled with happiness,
            love and success! ❤️
        </p>

    </div>

    <!-- ROBOT -->

    <div class="robot" id="robot">

        <div class="antenna"></div>

        <div class="head">
            <div class="eyes">
                <span></span>
                <span></span>
            </div>
            <div class="mouth"></div>
        </div>

        <div class="body">
            <div class="heart"></div>
        </div>

        <div class="arm left-arm"></div>
        <div class="arm right-arm"></div>

        <div class="gift">
            <div class="ribbon"></div>
            <div class="vai">🎀</div>
        </div>

        <div class="leg left-leg"></div>
        <div class="leg right-leg"></div>

    </div>

    <!-- CAKE -->

    <div class="cake" id="cake">
        🎂
    </div>

    <div class="balloons">
        <span>🎈</span>
        <span>🎈</span>
        <span>🎈</span>
        <span>🎈</span>
        <span>🎈</span>
    </div>

    <div id="confetti"></div>

</div>

<audio id="music" src="birthday.mp3" preload="auto"></audio>

<script src="script.js"></script>

</body>
</html>
